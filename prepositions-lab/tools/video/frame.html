<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prepositions Lab video frame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="../../css/app.css">
<style>
  /* One 1920 x 1080 video frame: a whiteboard that fills the screen, a teacher's hand holding
     a marker, and a subtitle line for what the teacher is saying. */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: var(--font-body); color: var(--fg); position: relative; }
  .v-label { position: absolute; top: 14px; font: 700 19px/1.2 var(--font-body); color: var(--muted); }
  .v-label--left { left: 40px; }
  .v-label--right { right: 40px; text-align: right; }
  #board { position: absolute; left: 208px; top: 44px; width: 1504px; height: 940px; display: block; }
  #board > g[hidden] { display: none; }
  .v-cap { position: absolute; left: 120px; right: 120px; top: 988px; height: 86px; display: flex; align-items: center; justify-content: center; text-align: center; font: 400 28px/1.3 var(--font-body); color: #3a4554; }
  .v-cap { z-index: 2; }
  .v-cap > div { background: rgb(255 255 255 / 92%); border-radius: 12px; padding: 6px 18px; }
  .v-cap .key { color: var(--accent); font-weight: 700; }
  .v-cap em { font-style: italic; color: var(--accent-2); }
  #hand { position: absolute; left: 0; top: 0; width: 1200px; height: 1200px; pointer-events: none; filter: drop-shadow(10px 14px 10px rgb(0 0 0 / 22%)); will-change: transform; }
</style>
</head>
<body>
  <div class="v-label v-label--left" id="label"></div>
  <div class="v-label v-label--right" id="step"></div>
  <svg id="board" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet"><defs></defs></svg>
  <div class="v-cap" id="cap"></div>

  <!-- The teacher's hand: the marker's tip is at (14, 12) in this drawing; the arm runs off the frame. -->
  <svg id="hand" viewBox="0 0 1500 1500">
    <g transform="translate(14 12) rotate(38)" stroke-linejoin="round">
      <!-- forearm and sleeve -->
      <path d="M250 -58 C 420 -66, 640 -60, 1700 -40 L 1700 170 C 700 160, 460 140, 262 104 Z" fill="#edbd98" stroke="#b9805c" stroke-width="3"/>
      <path d="M520 -66 C 700 -80, 860 -80, 1700 -76 L 1700 220 C 860 196, 700 186, 540 168 C 556 100, 552 0, 520 -66 Z" fill="#2f4a78" stroke="#1f3458" stroke-width="3"/>
      <path d="M540 -50 C 566 20, 568 100, 552 160" fill="none" stroke="#1f3458" stroke-width="3"/>
      <!-- the marker -->
      <path d="M0 0 L 24 -8 L 24 8 Z" fill="#1f2a3a"/>
      <rect x="22" y="-12" width="52" height="24" rx="5" fill="#26303d"/>
      <rect x="72" y="-14" width="250" height="28" rx="9" fill="#f6f7f9" stroke="#8d97a5" stroke-width="3"/>
      <rect x="300" y="-15" width="38" height="30" rx="7" fill="#1d4f9c"/>
      <!-- back of the hand -->
      <path d="M150 -66 C 200 -96, 300 -92, 330 -42 C 352 0, 340 70, 296 104 C 250 136, 180 124, 156 82 C 134 44, 124 -30, 150 -66 Z" fill="#f2c6a3" stroke="#b9805c" stroke-width="3"/>
      <path d="M200 -70 C 230 -84, 270 -80, 290 -62" fill="none" stroke="#c99470" stroke-width="2.5"/>
      <!-- index finger along the top of the marker, nail near the front -->
      <path d="M70 -30 C 100 -40, 170 -44, 210 -38 C 232 -34, 232 -8, 210 -6 C 170 -2, 110 -4, 80 -6 C 60 -8, 56 -24, 70 -30 Z" fill="#f2c6a3" stroke="#b9805c" stroke-width="3"/>
      <path d="M74 -24 C 74 -14, 82 -10, 98 -11 L 98 -27 C 86 -28, 78 -28, 74 -24 Z" fill="#f8dccb" stroke="#c99470" stroke-width="2"/>
      <path d="M140 -36 C 136 -26, 136 -16, 140 -8" fill="none" stroke="#c99470" stroke-width="2.5"/>
      <!-- thumb pressing from the other side -->
      <path d="M84 10 C 116 4, 180 10, 214 24 C 236 34, 230 60, 206 60 C 166 58, 114 46, 92 36 C 72 28, 70 14, 84 10 Z" fill="#efbf9b" stroke="#b9805c" stroke-width="3"/>
      <path d="M88 14 C 88 24, 96 30, 110 30 L 112 12 C 100 10, 92 10, 88 14 Z" fill="#f8dccb" stroke="#c99470" stroke-width="2"/>
      <!-- curled fingers behind the marker -->
      <path d="M206 -6 C 232 -2, 252 14, 250 34" fill="none" stroke="#b9805c" stroke-width="2.5"/>
      <path d="M240 70 C 268 62, 292 40, 300 14" fill="none" stroke="#c99470" stroke-width="2.5"/>
    </g>
  </svg>
<script>
  // The renderer loads the engine and the course content, then calls show() for each frame.
  const scenes = {};
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="key">$1</span>').replace(/(^|[\s(])_(.+?)_(?=[\s.,;:)!?]|$)/g, "$1<em>$2</em>");
  const plain = (s) => String(s).replace(/\*\*(.+?)\*\*/g, "$1").replace(/(^|[\s(])_(.+?)_(?=[\s.,;:)!?]|$)/g, "$1$2");
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const svg = document.getElementById("board");
  const PEN = new Set(["draw", "write", "highlight"]);
  const REST = [1010, 700]; // where the hand waits, off the lower right of the board

  // A teacher draws one thing at a time, so strokes that the app draws together are drawn in turn.
  function oneAtATime(steps) {
    return steps.map((st) => ({
      ...st,
      actions: (st.actions || []).map((a) => (a.sync && PEN.has(a.do) ? { ...a, sync: false, offset: undefined, gap: 120 } : a)),
    }));
  }

  function scene(key, steps) {
    if (!scenes[key]) {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.appendChild(g);
      scenes[key] = new PLAB.Scene(svg, g, oneAtATime(steps), "v-" + key.replace(/[^\w-]/g, "_"));
    }
    return scenes[key];
  }

  function wrap(text, max) {
    const out = [];
    let line = "";
    for (const w of text.split(/\s+/)) {
      if (line && (line + " " + w).length > max) (out.push(line), (line = w));
      else line = line ? line + " " + w : w;
    }
    if (line) out.push(line);
    return out;
  }

  // Lay out a handwritten board; shrink everything until it fits.
  function fitted(build) {
    for (let k = 1; k > 0.5; k *= 0.92) {
      const r = build(k);
      if (r.bottom <= 575) return r.steps;
    }
    return build(0.5).steps;
  }

  // The lesson title, written on the board by hand.
  function titleBoard(o) {
    return fitted((k) => {
      const acts = [];
      let y = 72 * k;
      acts.push({ do: "write", id: "eyebrow", text: o.eyebrow, x: 480, y, size: 24 * k, anchor: "middle", ink: "muted" });
      wrap(o.title, 28).forEach((l, i) => {
        y += (i ? 62 : 70) * k;
        acts.push({ do: "write", id: "title" + i, text: l, x: 480, y, size: 56 * k, anchor: "middle", ink: "accent" });
      });
      acts.push({ do: "draw", id: "rule", shape: "line", from: [230, y + 22 * k], to: [730, y + 18 * k], ink: "accent2", width: 4 });
      y += 86 * k;
      acts.push({ do: "write", id: "today", text: "In this lesson:", x: 70, y, size: 32 * k, ink: "main" });
      (o.items || []).forEach((item, i) => {
        wrap(plain(item), Math.round(60 / k)).forEach((l, j) => {
          y += (j ? 40 : 54) * k;
          if (!j) acts.push({ do: "draw", id: `dot${i}`, shape: "circle", cx: 92, cy: y - 9 * k, r: 4, ink: "accent2", fill: "solid" });
          acts.push({ do: "write", id: `obj${i}-${j}`, text: l, x: 112, y, size: 29 * k, ink: "main", gap: j ? 80 : 260 });
        });
      });
      return { bottom: y, steps: [{ actions: acts }] };
    });
  }

  // A practice question written on the board; the second step marks the answer and says why.
  function questionBoard(o) {
    return fitted((k) => {
      const ask = [], mark = [];
      let y = 64 * k;
      ask.push({ do: "write", id: "yt", text: "Your turn", x: 60, y, size: 28 * k, ink: "accent2" });
      ask.push({ do: "draw", id: "yt-u", shape: "line", from: [60, y + 10], to: [60 + 130 * k, y + 8], ink: "accent2", width: 3 });
      wrap(plain(o.prompt), Math.round(50 / k)).forEach((l, i) => {
        y += (i ? 44 : 64) * k;
        ask.push({ do: "write", id: "p" + i, text: l, x: 60, y, size: 34 * k, ink: "main" });
      });
      y += 18 * k;
      o.options.forEach((op, i) => {
        wrap(plain(op), Math.round(54 / k)).forEach((l, j) => {
          y += (j ? 40 : 58) * k;
          if (!j) {
            ask.push({ do: "write", id: `L${i}`, text: "ABCDE"[i], x: 80, y, size: 32 * k, anchor: "middle", ink: "accent", gap: 300 });
            if (i === o.reveal) {
              mark.push({ do: "draw", id: "ring", shape: "circle", cx: 80, cy: y - 11 * k, r: 24 * k, ink: "accent2", width: 4, gap: 300 });
              mark.push({ do: "draw", id: "tick", shape: "group", ink: "accent2", width: 4.5, parts: [
                { shape: "line", from: [30 - 18 * k, y - 14 * k], to: [30 - 8 * k, y - 2 * k] },
                { shape: "line", from: [30 - 8 * k, y - 2 * k], to: [30 + 10 * k, y - 30 * k] }] });
            }
          }
          ask.push({ do: "write", id: `o${i}-${j}`, text: l, x: 118, y, size: 31 * k, ink: "main", gap: j ? 80 : 160 });
        });
      });
      y += 26 * k;
      if (o.why) {
        wrap(plain(o.why), Math.round(56 / k)).forEach((l, i) => {
          y += (i ? 40 : 46) * k;
          mark.push({ do: "write", id: "w" + i, text: l, x: 60, y, size: 30 * k, ink: "accent2", gap: i ? 80 : 400 });
        });
      }
      return { bottom: y, steps: [{ actions: ask }, { actions: mark }] };
    });
  }

  // Where is the marker's tip at time t of a step, in board units?
  function pointAt(sc, e, p) {
    const item = sc.items.get(e.a.id);
    const off = (pt) => [pt[0] + (item.dx || 0), pt[1] + (item.dy || 0)];
    if (item.kind === "write") {
      const b = item.box;
      return off([b.x + Math.min(b.width, (b.width * 1.15 + 30) * p), b.y + b.height * 0.72]);
    }
    let left = ease(Math.max(0, Math.min(1, p))) * item.total;
    for (const part of item.parts) {
      if (left <= part.len || part === item.parts[item.parts.length - 1]) {
        const q = part.path.getPointAtLength(Math.max(0, Math.min(part.len, left)));
        return off([q.x, q.y]);
      }
      left -= part.len;
    }
  }

  function tip(sc, step, t) {
    const es = sc.timed.filter((e) => e.s === step && PEN.has(e.a.do));
    const now = es.find((e) => t >= e.start && t < e.start + e.dur);
    if (now) return pointAt(sc, now, (t - now.start) / now.dur);
    const prev = es.filter((e) => e.start + e.dur <= t).sort((a, b) => a.start + a.dur - (b.start + b.dur)).pop();
    const next = es.filter((e) => e.start > t).sort((a, b) => a.start - b.start)[0];
    const lerp = (A, B, k) => [A[0] + (B[0] - A[0]) * ease(k), A[1] + (B[1] - A[1]) * ease(k)];
    if (prev && next) {
      const t0 = prev.start + prev.dur;
      return lerp(pointAt(sc, prev, 1), pointAt(sc, next, 0), (t - t0) / Math.max(1, next.start - t0));
    }
    if (prev) return lerp(pointAt(sc, prev, 1), REST, Math.min(1, (t - prev.start - prev.dur) / 700));
    if (next) return lerp(REST, pointAt(sc, next, 0), Math.max(0, 1 - (next.start - t) / 700));
    return REST;
  }

  // Build a board ahead of time so the renderer can read its timings.
  window.prepare = (f) => {
    const sc = f.board === "title" ? scene(f.key, titleBoard(f.overlay)) : f.board === "question" ? scene(f.key, questionBoard(f.overlay)) : scene(f.key, PLAB.lessons[f.lesson].steps);
    return { length: sc.stepLength.slice() };
  };

  window.show = (f) => {
    document.getElementById("label").textContent = f.label || "";
    document.getElementById("step").textContent = f.stepTitle || "";
    document.getElementById("cap").innerHTML = f.caption ? `<div>${rich(f.caption)}</div>` : "";
    window.prepare(f);
    for (const k in scenes) scenes[k].root.style.display = k === f.key ? "" : "none";
    const sc = scenes[f.key];
    sc.render(f.step, f.t);
    const [bx, by] = f.handAway ? REST : tip(sc, f.step, f.t);
    const pt = new DOMPoint(bx, by).matrixTransform(svg.getScreenCTM());
    document.getElementById("hand").style.transform = `translate(${(pt.x - 11.2).toFixed(1)}px, ${(pt.y - 9.6).toFixed(1)}px)`;
  };
</script>
</body>
</html>
