<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prepositions Lab video frame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="../../css/app.css">
<style>
  /* One 1920 x 1080 video frame: a header, the teaching board, and a caption line. */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: var(--font-body); color: var(--fg); }
  .v-head { position: absolute; left: 80px; right: 80px; top: 26px; height: 64px; display: flex; align-items: center; gap: 22px; }
  .v-mark { display: grid; place-items: center; width: 52px; height: 52px; border: 3px solid var(--fg); border-radius: 9px 12px 8px 11px; font: 700 1.6rem/1 var(--font-board); color: var(--accent); flex: none; }
  .v-eyebrow { font: 700 18px/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .v-title { font: 700 34px/1.15 var(--font-display); }
  .v-step { margin-left: auto; text-align: right; font: 700 20px/1.3 var(--font-body); color: var(--muted); max-width: 520px; }
  .v-board { position: absolute; left: 272px; top: 108px; width: 1376px; height: 860px; border: 2px solid var(--board-edge); border-radius: 16px; background: var(--board); overflow: hidden; }
  .v-board svg { width: 100%; height: 100%; display: block; }
  .v-cap { position: absolute; left: 140px; right: 140px; top: 984px; height: 84px; display: flex; align-items: center; justify-content: center; text-align: center; font: 400 31px/1.3 var(--font-body); color: var(--fg); }
  .v-cap .key { color: var(--accent); font-weight: 700; }
  .v-cap em { font-style: italic; color: var(--accent-2); }
  .ov { position: absolute; inset: 0; background: rgb(255 255 255 / 94%); display: flex; flex-direction: column; justify-content: center; padding: 60px 110px; gap: 26px; }
  .ov[hidden] { display: none; }
  .ov-eyebrow { font: 700 22px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-2); }
  .ov-title { font: 700 64px/1.1 var(--font-display); }
  .ov-sub { font: 400 30px/1.45 var(--font-body); color: var(--muted); max-width: 1100px; }
  .ov ul { margin: 0; padding-left: 1.2em; font: 400 28px/1.5 var(--font-body); }
  .q-prompt { font: 700 42px/1.3 var(--font-body); }
  .q-opts { display: flex; flex-direction: column; gap: 16px; }
  .q-opt { display: flex; gap: 20px; align-items: center; font: 400 34px/1.3 var(--font-body); border: 3px solid var(--line); border-radius: 14px; padding: 14px 22px; background: #fff; }
  .q-opt b { display: grid; place-items: center; flex: none; width: 50px; height: 50px; border-radius: 50%; background: var(--sunk); font-size: 28px; }
  .q-opt.right { border-color: var(--good); background: var(--good-bg); }
  .q-opt.right b { background: var(--good); color: #fff; }
  .q-opt.dim { color: #9aa1ab; border-color: #e6e8eb; }
  .q-opt.dim b { color: #9aa1ab; }
  .q-think { font: 700 30px/1 var(--font-body); color: var(--trouble, #b8402f); color: var(--bad); }
  .q-why { font: 400 30px/1.4 var(--font-body); color: var(--fg); }
</style>
</head>
<body>
  <div class="v-head">
    <div class="v-mark">in</div>
    <div><div class="v-eyebrow" id="eyebrow"></div><div class="v-title" id="title"></div></div>
    <div class="v-step" id="step"></div>
  </div>
  <div class="v-board">
    <svg id="board" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet"><defs></defs><g id="board-main"></g></svg>
    <div class="ov" id="ov" hidden></div>
  </div>
  <div class="v-cap" id="cap"></div>
<script>
  // The renderer loads the engine and the course content, then calls show() for each frame.
  const scenes = {};
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="key">$1</span>').replace(/(^|[\s(])_(.+?)_(?=[\s.,;:)!?]|$)/g, "$1<em>$2</em>");
  let current = null;

  window.useLesson = (id) => {
    if (current === id) return;
    const main = document.getElementById("board-main");
    main.textContent = "";
    document.querySelector("#board defs").textContent = "";
    scenes[id] = new PLAB.Scene(document.getElementById("board"), main, PLAB.lessons[id].steps, "v-" + id);
    current = id;
  };

  window.show = (f) => {
    document.getElementById("eyebrow").textContent = f.eyebrow || "";
    document.getElementById("title").textContent = f.title || "";
    document.getElementById("step").textContent = f.stepTitle || "";
    document.getElementById("cap").innerHTML = f.caption ? `<div>${rich(f.caption)}</div>` : "";
    if (f.lesson) {
      useLesson(f.lesson);
      scenes[f.lesson].render(f.step ?? -1, f.t ?? 0);
    }
    const ov = document.getElementById("ov");
    const o = f.overlay;
    if (!o) { ov.hidden = true; return; }
    ov.hidden = false;
    if (o.type === "title") {
      ov.innerHTML = `<div class="ov-eyebrow">${esc(o.eyebrow)}</div><div class="ov-title">${esc(o.title)}</div>` +
        (o.sub ? `<div class="ov-sub">${rich(o.sub)}</div>` : "") +
        (o.items ? `<ul>${o.items.map((i) => `<li>${rich(i)}</li>`).join("")}</ul>` : "");
    } else if (o.type === "question") {
      const letters = "ABCDE";
      ov.innerHTML = `<div class="ov-eyebrow">Your turn · practice question</div><div class="q-prompt">${rich(o.prompt)}</div>
        <div class="q-opts">${o.options.map((op, i) => `<div class="q-opt ${o.reveal == null ? "" : i === o.reveal ? "right" : "dim"}"><b>${letters[i]}</b><span>${rich(op)}</span></div>`).join("")}</div>
        ${o.reveal == null && o.think ? `<div class="q-think">Pause the video and think${".".repeat(o.think)}</div>` : ""}
        ${o.reveal != null && o.why ? `<div class="q-why">${rich(o.why)}</div>` : ""}`;
    }
  };
</script>
</body>
</html>
