<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Board">
<title>Maths Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a teacher's whiteboard on a white desk. Board first, controls under it, the teacher's words beside it (under it on phones). Tab bar fixed at the bottom. Single light theme on purpose. */
:root{
  color-scheme:light;
  --desk:#f4f5f9; --paper:#ffffff; --ui:#1d2b4f; --ui-2:#5b6683; --rule:#e1e4ed; --frame:#c9ced9;
  --ink-main:#1d2b4f; --ink-accent:#2563c9; --ink-accent2:#1f8a4c; --ink-muted:#8a93a6; --ink-trouble:#d23b2f; --ink-hi:#ffe066;
  --hi-soft:#fff3b8; --good-soft:#e2f4e9; --bad-soft:#fde5e2; --acc-soft:#e5edfc;
  --f-hand:'Kalam','Comic Sans MS',cursive; --f-ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tabbar:64px;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ui);font-family:var(--f-ui);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:var(--f-hand);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.2rem)}
h2{font-family:var(--f-hand);font-weight:700;font-size:1.45rem}
h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink-accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-2)}
.muted{color:var(--ui-2)}
.btn{border:2px solid var(--ui);background:var(--paper);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.1;text-decoration:none}
.btn:hover{background:var(--desk)}
.btn.primary{background:var(--ink-accent);border-color:var(--ink-accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--rule)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px}
.hand{font-family:var(--f-hand)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.92em;margin:0 2px;font-family:var(--f-hand);font-weight:700}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--paper);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a{flex:1;max-width:180px;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ui-2);font-size:.78rem;font-weight:700}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--ink-accent)}
.tabbar .badge{position:absolute;margin-left:22px;margin-top:-26px;background:var(--ink-trouble);color:#fff;border-radius:9px;font-size:.65rem;padding:0 5px}

/* board */
.stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:1fr}}
.boardcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.board{background:#fff;border-radius:12px;box-shadow:0 1px 0 var(--frame),0 6px 18px rgba(29,43,79,.08);overflow:hidden}
.board svg{display:block;width:100%;height:auto}
.board text.hand{font-family:var(--f-hand)}
.tray{height:12px;margin:-6px 18px 0;background:#dfe2ea;border-radius:0 0 8px 8px;display:flex;gap:10px;justify-content:center;align-items:flex-start}
.tray span{width:46px;height:8px;border-radius:4px;margin-top:2px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl{border:1px solid var(--rule);background:var(--paper);border-radius:10px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ctrl:hover{border-color:var(--ui)}
.ctrl svg{width:22px;height:22px}
.scrub{flex:1;min-width:120px;accent-color:var(--ink-accent)}
.speed{border:1px solid var(--rule);border-radius:10px;height:44px;padding:0 8px;background:var(--paper);font:inherit;font-weight:700}
.next{height:48px;padding:0 22px;font-size:1.05rem}
.next.ready{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 6px var(--acc-soft)}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--frame);background:var(--paper);font-size:.8rem;font-weight:700;color:var(--ui-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dot.seen{border-color:var(--ink-accent);color:var(--ink-accent)}
.dot.on{background:var(--ink-accent);border-color:var(--ink-accent);color:#fff}
.dot:disabled{cursor:not-allowed;opacity:.5}

/* explanation */
.explain{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ehead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lines li{padding:7px 10px;border-radius:8px;font-size:1.04rem;transition:background .25s,opacity .25s}
.lines li.ahead{opacity:.32}
.lines li.lit{background:var(--hi-soft)}
.lines b{color:var(--ink-accent)}
.star{border:0;background:none;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--frame);padding:2px}
.star.on{color:#e0a800}
.check{border-top:2px dashed var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.qtext{font-size:1.08rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.opt:hover{border-color:var(--ink-accent)}
.opt .why{font-size:.93rem;font-weight:400}
.opt.ok{border-color:var(--ink-accent2);background:var(--good-soft)}
.opt.bad{border-color:var(--ink-trouble);background:var(--bad-soft)}
.opt .mark{font-weight:700}
.opt.ok .mark{color:var(--ink-accent2)} .opt.bad .mark{color:var(--ink-trouble)}
.lockmsg{font-size:.9rem;color:var(--ink-trouble);font-weight:700}
textarea{font:inherit;width:100%;min-height:70px;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;resize:vertical;background:var(--paper);color:var(--ui)}
details summary{cursor:pointer;font-weight:700;color:var(--ink-accent)}

/* home */
.cont{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:84px;height:84px}
.search{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border:2px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ui)}
.phases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.phases{grid-template-columns:1fr}}
.phase{background:var(--paper);border:1px solid var(--rule);border-left:8px solid var(--pc);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.phase.soon{opacity:.6}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--desk);text-decoration:none;color:var(--ui);cursor:pointer;border:0;width:100%;text-align:left}
.lesson:hover{background:var(--acc-soft)}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--rule);color:var(--ui-2);white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--ink-accent2)}
.pill.start{background:var(--hi-soft);color:#8a6a00}
.pill.bad{background:var(--bad-soft);color:var(--ink-trouble)}

/* practice + notebook */
.qcards{display:flex;flex-direction:column;gap:14px}
.nbgroup{display:flex;flex-direction:column;gap:10px}
.nbitem{background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--ink-trouble);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sheet{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 12px}
.sheet-in{width:min(640px,100%);background:var(--paper);border:2px solid var(--ui);border-radius:14px;padding:16px 18px;box-shadow:0 10px 30px rgba(29,43,79,.18);display:flex;flex-direction:column;gap:10px}
.pbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}.pbar span{display:block;height:100%;background:var(--ink-accent);transition:width .2s}
.dlrow{display:flex;gap:10px;flex-wrap:wrap}.dlgroup{display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</a>
  <a href="#board" data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21l4-4 4 4"/><path d="M7 13c2-4 4 1 6-3s3 1 4-1"/></svg>Board</a>
  <a href="#notebook" data-tab="notebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M5 17a2 2 0 0 1 2-2h12"/><path d="M9 7h6M9 10h4"/></svg>Notebook<span class="badge" id="nbbadge" hidden></span></a>
</nav>

<script>
/* =====================================================================
   1. BOARD ENGINE
   The board is computed, never animated with timers:
   renderBoard(lesson, stepIndex, t) returns the exact board at time t.
   ===================================================================== */
const BW=960,BH=600,GAP=140;
const DUR={draw:1100,write:1500,highlight:650,move:1200,erase:500,wait:700};
const INK={main:'#1d2b4f',accent:'#2563c9',accent2:'#1f8a4c',muted:'#8a93a6',trouble:'#d23b2f',hi:'#ffe066'};
const inkOf=k=>INK[k]||k;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const f1=n=>Math.round(n*10)/10;
const range=(a,b)=>Array.from({length:Math.max(0,b-a)},(_,i)=>a+i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* text measurement in the handwriting font */
const MCTX=document.createElement('canvas').getContext('2d'),MC=new Map();
function measure(t,s,w=400){const k=t+'|'+s+'|'+w;if(MC.has(k))return MC.get(k);MCTX.font=`${w} ${s}px Kalam, cursive`;const v=MCTX.measureText(t).width;MC.set(k,v);return v}

/* hand-drawn geometry: wobbly point lists, seeded so they never change */
function wl(r,x1,y1,x2,y2,amp=1.4){const L=Math.hypot(x2-x1,y2-y1)||1,n=Math.max(2,Math.ceil(L/16)),nx=-(y2-y1)/L,ny=(x2-x1)/L,fa=1+r()*1.5,fb=2.5+r()*2,pa=r()*6.283,pb=r()*6.283,k=Math.min(1,L/60),pts=[];
  for(let i=0;i<=n;i++){const t=i/n,o=amp*k*(Math.sin(t*6.283*fa+pa)*.65+Math.sin(t*6.283*fb+pb)*.35),j=(i===0||i===n)?(r()-.5)*1.4:0;pts.push([x1+(x2-x1)*t+nx*o+j,y1+(y2-y1)*t+ny*o+j])}return pts}
function wcirc(r,cx,cy,rx,ry){const n=Math.max(18,Math.ceil(Math.PI*(rx+ry)/11)),a0=r()*6.283,over=.14+r()*.1,fq=2+r()*2,ph=r()*6.283,pts=[];
  for(let i=0;i<=n;i++){const t=i/n,a=a0+t*(6.283+over),k=1+.02*Math.sin(t*6.283*fq+ph)+(t>.92?(t-.92)*.35:0);pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return pts}
const plen=p=>{let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s};
function pathD(p){const q=n=>f1(n);let d=`M${q(p[0][0])},${q(p[0][1])}`;if(p.length<3)return d+`L${q(p[1][0])},${q(p[1][1])}`;
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;d+=`Q${q(p[i][0])},${q(p[i][1])} ${q(mx)},${q(my)}`}const l=p[p.length-1];return d+`L${q(l[0])},${q(l[1])}`}
function joinSegs(r,P,amp){let p=[];for(let i=0;i<P.length-1;i++){const s=wl(r,P[i][0],P[i][1],P[i+1][0],P[i+1][1],amp);p=p.concat(i?s.slice(1):s)}return p}
const GC=new Map();
function geom(key,sh){if(GC.has(key))return GC.get(key);const r=rng(hash(key));let strokes=[],fill=null;
  switch(sh.kind){
    case 'line':strokes=[wl(r,sh.x1,sh.y1,sh.x2,sh.y2,sh.amp??1.4)];break;
    case 'arrow':{const a=Math.atan2(sh.y2-sh.y1,sh.x2-sh.x1),h=sh.head||16;strokes=[wl(r,sh.x1,sh.y1,sh.x2,sh.y2),wl(r,sh.x2,sh.y2,sh.x2-h*Math.cos(a-.45),sh.y2-h*Math.sin(a-.45),.4),wl(r,sh.x2,sh.y2,sh.x2-h*Math.cos(a+.45),sh.y2-h*Math.sin(a+.45),.4)];break}
    case 'rect':{const {x,y,w,h}=sh;const p=joinSegs(r,[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]],1.1);strokes=[p];fill=p;break}
    case 'circle':{const p=wcirc(r,sh.cx,sh.cy,sh.r,sh.r);strokes=[p];fill=p;break}
    case 'ellipse':{const p=wcirc(r,sh.cx,sh.cy,sh.rx,sh.ry);strokes=[p];fill=p;break}
    case 'poly':{const P=sh.closed?sh.pts.concat([sh.pts[0]]):sh.pts;const p=joinSegs(r,P,sh.amp??1.2);strokes=[p];if(sh.closed)fill=p;break}
    case 'lines':strokes=sh.segs.map(s=>wl(r,s[0],s[1],s[2],s[3],1));break;
    case 'tick':{const {x,y,s}=sh;strokes=[joinSegs(r,[[x-s*.85,y-s*.05],[x-s*.25,y+s*.6],[x+s*.9,y-s*.8]],.5)];break}
    case 'cross':{const {x,y,s}=sh;strokes=[wl(r,x-s*.7,y-s*.7,x+s*.7,y+s*.7,.6),wl(r,x+s*.7,y-s*.7,x-s*.7,y+s*.7,.6)];break}
    case 'approx':{const {x,y,s}=sh;strokes=[-1,1].map(k=>range(0,13).map(i=>{const t=i/12;return [x-s+2*s*t,y+k*s*.32+Math.sin(t*6.283)*s*.2]}));break}
    case 'circles':strokes=sh.cs.map(([cx,cy,rr])=>wcirc(r,cx,cy,rr,rr));break;
    case 'grid':{const {x,y,w,h,step}=sh,segs=[];for(let gx=x;gx<=x+w+.1;gx+=step)segs.push([gx,y,gx,y+h]);for(let gy=y;gy<=y+h+.1;gy+=step)segs.push([x,gy,x+w,gy]);strokes=segs.map(s=>wl(r,s[0],s[1],s[2],s[3],.5));break}
    default:throw new Error('Unknown shape '+sh.kind)}
  const all=strokes.flat(),xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  const g={strokes:strokes.map(p=>({d:pathD(p),len:plen(p)+1})),fillD:fill?pathD(fill)+'Z':null,bb:{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}};
  if(sh.kind==='circles')g.fillD=strokes.map(p=>pathD(p)+'Z').join(' ');
  g.total=g.strokes.reduce((a,s)=>a+s.len,0);GC.set(key,g);return g}

/* schedule: every action gets a start time inside its step */
function prepare(L){L.steps.forEach(st=>{let cur=0,prev=0;st.sched=st.actions.map(a=>{const dur=a.dur??DUR[a.type],start=a.sync?prev:cur;prev=start;cur=Math.max(cur,start+dur+GAP);return {...a,dur,start}});
  st.total=Math.max(1,...st.sched.map(a=>a.start+a.dur));
  st.explain.forEach(l=>{const a=st.sched.find(a=>a.id&&(a.id===l.cue||a.id.startsWith(l.cue+'.')));l.start=a?a.start:null})});return L}

/* the board state at time t: a pure function */
const resolve=(items,t)=>[...items.keys()].filter(k=>k===t||k.startsWith(t+'.'));
function stateAt(L,si,t){const items=new Map(),hls=[];
  for(let s=0;s<=Math.min(si,L.steps.length-1);s++){for(const a of L.steps[s].sched){if(s===si&&t<a.start)continue;const p=s<si?1:clamp((t-a.start)/a.dur);
    if(a.type==='draw'||a.type==='write'){items.delete(a.id);items.set(a.id,{a,p,op:1,dx:0,dy:0,hl:null})}
    else if(a.type==='highlight'){const ids=resolve(items,a.target);if(ids.length){hls.push({a,p,ids,op:1});ids.forEach(i=>items.get(i).hl={p,ink:a.ink||(a.style==='ring'?'trouble':'accent')})}}
    else if(a.type==='move'){resolve(items,a.target).forEach(i=>{const it=items.get(i);it.dx+=a.dx*p;it.dy+=a.dy*p-(a.arc||0)*Math.sin(Math.PI*p)})}
    else if(a.type==='erase'){const keep=a.keep||[];const ids=a.targets==='all'?[...items.keys()].filter(k=>!keep.some(kp=>k===kp||k.startsWith(kp+'.'))):a.targets.flatMap(tg=>resolve(items,tg));
      ids.forEach(i=>{if(p>=1)items.delete(i);else items.get(i).op*=1-p});
      for(let i=hls.length-1;i>=0;i--){const h=hls[i];if(h.ids.every(x=>!items.has(x)))hls.splice(i,1);else if(h.ids.some(x=>ids.includes(x)))h.op*=1-p}}}}
  return {items,hls}}
function itemBox(L,id,it){const a=it.a;if(a.type==='write'){const w=it.hl?measure(a.text,a.size,700):a.w;return {x:a.x+it.dx,y:a.y-.75*a.size+it.dy,w,h:.95*a.size}}const g=geom(L.id+'/'+id,a.shape);return {x:g.bb.x+it.dx,y:g.bb.y+it.dy,w:g.bb.w,h:g.bb.h}}
const union=bs=>{const x=Math.min(...bs.map(b=>b.x)),y=Math.min(...bs.map(b=>b.y));return {x,y,w:Math.max(...bs.map(b=>b.x+b.w))-x,h:Math.max(...bs.map(b=>b.y+b.h))-y}};
function strokesSVG(g,p,ink,sw){let rem=p*g.total,s='';for(const st of g.strokes){if(rem<=.01)break;const show=Math.min(st.len,rem);rem-=st.len;

function W(id,x,y,text,o={}){let size=o.size||30;const wt=o.weight||400,L=14,R=BW-14;let w=measure(text,size,wt);

  if(w>R-L){size=Math.floor(size*(R-L)/w);w=measure(text,size,wt);X=place()}
  if(X<L)X=L;if(X+w>R){size=Math.max(12,Math.floor(size*(R-X)/w));w=measure(text,size,wt);if(o.anchor==='middle')X=Math.max(L,x-w/2);if(X+w>R)X=R-w}
  return {type:'write',id,x:X,y,text,size,weight:wt,ink:o.ink||'main',w,dur:o.dur,sync:o.sync}}
const D=(id,shape,o={})=>({type:'draw',id,shape,ink:o.ink||'main',sw:o.sw||3,fill:o.fill,fillOp:o.fillOp,stroke:o.stroke,dur:o.dur,sync:o.sync});

function frac(id,cx,ym,n,d,o={}){const s=o.size||36,ink=o.ink||'main',w=fracW(n,d,s);
  return [W(id+'.n',cx,ym-.17*s,String(n),{size:s,ink,anchor:'middle',dur:o.dur||420,sync:o.sync}),D(id+'.l',{kind:'line',x1:cx-w/2,y1:ym,x2:cx+w/2,y2:ym,amp:.6},{ink,sw:Math.max(2,s/14),dur:280}),W(id+'.d',cx,ym+.8*s,String(d),{size:s,ink,anchor:'middle',dur:420})]}
/* a row of tokens: strings, or {n,d} fractions. Each token gets its own id: id.0, id.1 … */
function expr(id,x,ym,toks,o={}){const s=o.size||36,gap=o.gap??.32*s;
  const T=toks.map(t=>t&&t.n!==undefined?{...t,w:fracW(t.n,t.d,s)}:{t:typeof t==='object'?t.t:String(t),ink:typeof t==='object'?t.ink:undefined,w:measure(typeof t==='object'?t.t:String(t),s)});

  T.forEach((t,i)=>{const ink=t.ink||o.ink||'main',tid=`${id}.${i}`,sync=i===0?o.sync:false;

function shade(id,x,y,w,h,parts,from,to,ink,o={}){return D(id,{kind:'rect',x:x+from*w/parts+3,y:y+3,w:(to-from)*w/parts-6,h:h-6},{stroke:false,fill:ink,fillOp:.38,dur:o.dur||600,sync:o.sync})}

/* =====================================================================
   4. CONTENT VALIDATOR + LAYOUT CHECK (also used by the automated test)
   ===================================================================== */
function validate(lessons){const errs=[];
  for(const L of lessons){const ids=new Set(),allQ=[];
    L.steps.forEach((st,si)=>{for(const a of st.actions){if(!a.id){errs.push(`${L.id} step ${si+1}: an action has no id`);continue}if(ids.has(a.id))errs.push(`${L.id}: duplicate id "${a.id}"`);ids.add(a.id)}
      let last=-1;st.explain.forEach(l=>{if(l.start==null)errs.push(`${L.id} step ${si+1}: cue "${l.cue}" matches no board item`);else{if(l.start<last)errs.push(`${L.id} step ${si+1}: cue "${l.cue}" starts before the line above it`);last=l.start}});
      if(st.check)allQ.push([`step ${si+1}`,st.check])});
    (L.practice||[]).forEach((q,i)=>allQ.push([`practice ${i+1}`,q]));
    for(const [w,q] of allQ){const ok=q.options.filter(o=>o.ok).length;if(ok!==1)errs.push(`${L.id} ${w}: ${ok} correct options (must be exactly 1)`);
      q.options.forEach((o,j)=>{if(!o.why)errs.push(`${L.id} ${w}: option ${j+1} has no reason`);if(!o.ok&&!TAGS[o.tag])errs.push(`${L.id} ${w}: option ${j+1} has no known misunderstanding tag`)})}}
  return errs}
function layoutIssues(lessons){const out=[];
  for(const L of lessons)L.steps.forEach((st,si)=>{const {items}=stateAt(L,si,st.total+1),boxes=[];
    for(const [id,it] of items){const b=itemBox(L,id,it);if(b.x<2||b.y<2||b.x+b.w>BW-2||b.y+b.h>BH-2)out.push(`${L.id} step ${si+1}: "${id}" runs off the board`);if(it.a.type==='write')boxes.push([id,b])}
    for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const [ia,a]=boxes[i],[ib,b]=boxes[j],ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
      if(ox>4&&oy>4)out.push(`${L.id} step ${si+1}: "${ia}" overlaps "${ib}"`)}});
  return out}

function openBoard(id){const L=LBY[id||S.last]||LESSONS[0];S.last=L.id;save();const p=prog(L.id);PL.L=L;PL.clicked={};

function stageBoardHTML(){const L=PL.L;return `<div class="boardcol">

function goStep(si,play=true){const L=PL.L,p=prog(L.id);PL.si=si;PL.t=0;PL.lit=-2;p.step=si;p.max=Math.max(p.max,si);save();
  const stage=document.getElementById('stage');if(!stage)return;

  if(!document.getElementById('layer'))stage.innerHTML=stageBoardHTML();
  const st=L.steps[si];PL.ended=p.max>si||!!p.checks[si];
  if(reduce||!play){PL.t=play?0:st.total;PL.playing=false;if(reduce)PL.t=st.total}else PL.playing=true;
  if(PL.t>=st.total)PL.ended=true;

function nextLocked(){const L=PL.L,st=L.steps[PL.si];return !!(st&&st.check&&!prog(L.id).checks[PL.si])}
function buildExplain(){const L=PL.L,si=PL.si,st=L.steps[si],p=prog(L.id),bm=p.bm.includes(si);

function optHTML(q,qkey,i,o,shown,passed){const cls=shown?(o.ok?'ok':'bad'):'';return `<button class="opt ${cls}" data-q="${qkey}" data-o="${i}"><span>${shown?`<span class="mark">${o.ok?'✓ ':'✗ '}</span>`:''}${fmt(o.t)}</span>${shown?`<span class="why">${fmt(o.why)}</span>`:''}</button>`}
function renderCheck(){const L=PL.L,st=L.steps[PL.si],box=document.getElementById('checkbox');if(!box)return;const p=prog(L.id);
  if(!st.check||!PL.ended){box.innerHTML='';return}

function updateChrome(){const L=PL.L,st=L.steps[PL.si];if(!st)return;const n=document.getElementById('b-next'),p=prog(L.id);
  if(n){n.disabled=nextLocked();n.textContent=PL.si===L.steps.length-1?'Practice':'Next';n.classList.toggle('ready',PL.ended&&!n.disabled)}
  document.querySelectorAll('#dots .dot').forEach(d=>{const i=+d.dataset.step;d.classList.toggle('on',i===PL.si);d.classList.toggle('seen',i<=p.max);d.disabled=i>p.max})}
function draw(){const L=PL.L,st=L.steps[PL.si],layer=document.getElementById('layer');if(!layer)return;
  layer.innerHTML=renderBoard(L,PL.si,PL.t);
  const sc=document.getElementById('scrub');if(sc&&document.activeElement!==sc)sc.value=Math.round(PL.t/st.total*1000);
  const pb=document.getElementById('b-play');if(pb){const k=PL.playing?'pause':'play';if(pb.dataset.k!==k){pb.dataset.k=k;pb.innerHTML=icon(k);pb.setAttribute('aria-label',PL.playing?'Pause':'Play')}}
  let lit=-1;st.explain.forEach((l,i)=>{if(l.start!=null&&l.start<=PL.t)lit=i});
  if(lit!==PL.lit){PL.lit=lit;document.querySelectorAll('#lines li').forEach((li,i)=>{li.className=i===lit&&PL.t<st.total?'lit':i<=lit?'':'ahead'})}}
function frame(ts){const dt=PL.last?Math.min(100,ts-PL.last):0;PL.last=ts;
  if(view==='board'&&PL.L&&PL.si<PL.L.steps.length){const st=PL.L.steps[PL.si];
    if(PL.playing){PL.t=Math.min(st.total,PL.t+dt*PL.speed);PL.dirty=true;if(PL.t>=st.total){PL.playing=false;if(!PL.ended){PL.ended=true;renderCheck()}PL.lit=-2;updateChrome()}}
    if(PL.dirty){PL.dirty=false;draw()}}
  requestAnimationFrame(frame)}

/* ---------- checks, practice, notebook ---------- */
function allQuestions(L){const m={};L.steps.forEach((st,i)=>{if(st.check)m['s'+i]=st.check});(L.practice||[]).forEach((q,i)=>m['p'+i]=q);return m}

  if(!o.ok&&!fromReview){const exists=S.nb.some(n=>n.lesson===L.id&&n.qkey===qkey&&n.oi===oi&&!n.mastered);if(!exists)S.nb.unshift({id:S.seq++,lesson:L.id,qkey,oi,tag:o.tag,made:Date.now(),stage:0,due:Date.now()+INTERVALS[0],mastered:false})}
  if(o.ok){if(qkey[0]==='s')p.checks[+qkey.slice(1)]=true;else p.prac[+qkey.slice(1)]=true}
  save();setTab(view);return o.ok}

    ${p.done?`<p style="color:${INK.accent2};font-weight:700">Well done. This lesson is finished.</p>`:''}

function viewNotebook(){const due=dueNow(),groups={};S.nb.filter(n=>!n.mastered).forEach(n=>(groups[n.tag]=groups[n.tag]||[]).push(n));const mastered=S.nb.filter(n=>n.mastered).length;
  const when=t=>{const m=Math.round((t-Date.now())/60e3);return m<=0?'due now':m<60?`in ${m} min`:m<1440?`in ${Math.round(m/60)} h`:`in ${Math.round(m/1440)} days`};

  ${Object.keys(groups).length?Object.entries(groups).map(([tag,list])=>`<section class="nbgroup"><h2>${esc(TAGS[tag]||tag)} <span class="pill bad">${list.length}</span></h2>${list.map(n=>{const L=LBY[n.lesson],q=allQuestions(L)[n.qkey],o=q.options[n.oi],c=q.options.find(x=>x.ok);
    return `<article class="nbitem"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="muted" style="font-size:.85rem">${esc(L.title)}</span><span class="pill ${n.due<=Date.now()?'bad':''}">Review ${when(n.due)} · ${n.stage}/5</span></div><p class="qtext">${fmt(q.q)}</p><p><b>You chose:</b> ${fmt(o.t)}. ${fmt(o.why)}</p><p><b style="color:${INK.accent2}">Right answer:</b> ${fmt(c.t)}. ${fmt(c.why)}</p></article>`}).join('')}</section>`).join(''):`<section class="card"><h2>Nothing here yet</h2><p class="muted">When you choose a wrong answer in a lesson, it is saved here with the reason, so you can learn from it.</p></section>`}
  ${mastered?`<p class="muted">${mastered} mistake${mastered>1?'s':''} mastered.</p>`:''}</div>`}
function reviewHTML(n){const L=LBY[n.lesson],q=allQuestions(L)[n.qkey],k='r'+n.id,cl=PL.clicked[k]||[];
  return `<div class="card" style="background:var(--desk)"><p class="qtext">${fmt(q.q)}</p><div class="opts" style="margin-top:10px">${q.options.map((o,j)=>optHTML(q,k,j,o,cl.includes(j),false)).join('')}</div></div>`}

/* =====================================================================
   7. NOTES PDF: one lesson, one section, or the whole book.
   Made on the device with jsPDF (shipped with the app as jspdf.umd.min.js).
   Boards are redrawn on a canvas in the handwriting font, so they keep
   their hand-drawn look in the PDF.
   ===================================================================== */
const IS_APP=!!document.querySelector('link[rel=manifest]');
const APP_URL='https://ayezafatimaxyz1-rgb.github.io/Grammar-Tutor/maths-board/';
function roundRect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
/* the finished board of one step, drawn on a canvas (same state as the SVG board at the end of the step) */
function boardCanvas(L,si,scale=1.4){const c=document.createElement('canvas');c.width=BW*scale;c.height=BH*scale;const x=c.getContext('2d');x.scale(scale,scale);
  x.fillStyle='#fff';x.fillRect(0,0,BW,BH);x.strokeStyle='#c9ced9';x.lineWidth=3;roundRect(x,1.5,1.5,BW-3,BH-3,10);x.stroke();
  const {items,hls}=stateAt(L,si,L.steps[si].total+1);x.lineCap='round';x.lineJoin='round';
  for(const h of hls)if(h.a.style==='swipe'){const bb=union(h.ids.map(i=>itemBox(L,i,items.get(i))));x.save();x.translate(bb.x,bb.y);x.rotate(-.7*Math.PI/180);x.globalAlpha=.9*h.op;x.fillStyle=INK.hi;roundRect(x,-6,-4,bb.w+12,bb.h+8,7);x.fill();x.restore()}
  for(const [id,it] of items){const a=it.a;x.save();x.globalAlpha=it.op;x.translate(it.dx,it.dy);
    if(a.type==='draw'){const g=geom(L.id+'/'+id,a.shape);if(a.fill&&g.fillD){x.globalAlpha=it.op*(a.fillOp??.3);x.fillStyle=inkOf(a.fill);x.fill(new Path2D(g.fillD));x.globalAlpha=it.op}
      if(a.stroke!==false){x.strokeStyle=inkOf(a.ink);x.lineWidth=a.sw||3;for(const st of g.strokes)x.stroke(new Path2D(st.d))}}
    else{const lit=!!it.hl;x.font=`${lit?700:a.weight} ${a.size}px Kalam, cursive`;x.fillStyle=inkOf(lit?it.hl.ink:a.ink);x.fillText(a.text,a.x,a.y)}
    x.restore()}
  for(const h of hls)if(h.a.style!=='swipe'){const bb=union(h.ids.map(i=>itemBox(L,i,items.get(i)))),st=h.a.style;
    const shape=st==='ring'?{kind:'ellipse',cx:bb.x+bb.w/2,cy:bb.y+bb.h/2,rx:bb.w/2+14,ry:bb.h/2+11}:{kind:'line',x1:bb.x-4,y1:bb.y+bb.h+7,x2:bb.x+bb.w+4,y2:bb.y+bb.h+7};
    const g=geom(`${L.id}/hl/${h.a.id}/${Math.round(bb.x)},${Math.round(bb.y)},${Math.round(bb.w)}`,shape);x.save();x.globalAlpha=h.op;x.strokeStyle=inkOf(h.a.ink||(st==='ring'?'trouble':'accent'));x.lineWidth=3;x.lineCap='round';for(const s of g.strokes)x.stroke(new Path2D(s.d));x.restore()}
  return c}

let jsPDFReady=null;
function loadJsPDF(){if(window.jspdf)return Promise.resolve(window.jspdf.jsPDF);
  return jsPDFReady||(jsPDFReady=new Promise((res,rej)=>{const s=document.createElement('script');s.src='jspdf.umd.min.js';s.onload=()=>window.jspdf?res(window.jspdf.jsPDF):rej(new Error('PDF tool did not load'));s.onerror=()=>{jsPDFReady=null;rej(new Error('PDF tool could not be loaded'))};document.head.appendChild(s)}))}

/* plain text for the PDF's built-in font: fractions as 3/4, symbols it lacks replaced */
const pdfClean=s=>String(s).replace(/\{(\d+)\/(\d+)\}/g,'$1/$2').replace(/[−–—]/g,'-').replace(/✓/g,'(right)').replace(/✗/g,'(wrong)').replace(/≈/g,'~').replace(/→/g,'->').replace(/…/g,'...').replace(/[‘’]/g,"'").replace(/[“”]/g,'"');
function pdfRuns(s){const out=[];pdfClean(s).split(/(\*\*.+?\*\*)/).forEach(p=>{if(!p)return;if(p.length>4&&p.startsWith('**')&&p.endsWith('**')){out.push({t:p.slice(2,-2),st:'bold'});return}
  p.split(/(_[^_]+_)/).forEach(q=>{if(!q)return;if(/^_[^_]+_$/.test(q))out.push({t:q.slice(1,-1),st:'italic'});else out.push({t:q,st:'normal'})})});return out}

function makeBook(jsPDF,scope){
  const doc=new jsPDF({unit:'mm',format:'a4',compress:true}),PW=210,PH=297,M=16,CW=PW-2*M,NAVY=[29,43,79],BLUE=[37,99,201],GREEN=[31,138,76],GREY=[91,102,131];
  let y=M;const toc=[],key=[];
  const color=c=>doc.setTextColor(c[0],c[1],c[2]);
  const ensure=h=>{if(y+h>PH-18){doc.addPage();y=M+2}};
  const text=(s,size,st='normal',c=NAVY,x=M,w=CW,lh=size*.48)=>{doc.setFont('helvetica',st);doc.setFontSize(size);color(c);for(const line of doc.splitTextToSize(pdfClean(s),w)){ensure(lh);doc.text(line,x,y+lh*.8);y+=lh}};
  const rich=(s,size,x=M,w=CW,c=NAVY)=>{const lh=size*.5;doc.setFontSize(size);let cx=x;ensure(lh);
    for(const run of pdfRuns(s)){doc.setFont('helvetica',run.st);color(run.st==='bold'?BLUE:c);
      for(const word of run.t.split(/(\s+)/)){if(!word)continue;const ww=doc.getTextWidth(word);if(/^\s+$/.test(word)){if(cx>x)cx+=ww;continue}
        if(cx+ww>x+w&&cx>x){y+=lh;cx=x;ensure(lh)}doc.text(word,cx,y+lh*.8);cx+=ww}}y+=lh};
  const box=(x,yy,s=4)=>{doc.setDrawColor(150,158,175);doc.setLineWidth(.3);doc.rect(x,yy,s,s)};
  const question=(q,label,blank)=>{doc.setFontSize(11);ensure(16+q.options.reduce((h,o)=>h+doc.splitTextToSize(pdfClean(o.t),CW-12).length*5.6+1.2,0)+(blank?27:3));text(label,10,'bold',GREY);rich(q.q,11.5);y+=1;
    q.options.forEach((o,j)=>{doc.setFontSize(11);const lines=doc.splitTextToSize(`${'ABCD'[j]}.  ${pdfClean(o.t.replace(/\*\*/g,''))}`,CW-12);ensure(lines.length*5.6+1);box(M+1,y+1.2);doc.setFont('helvetica','normal');color(NAVY);lines.forEach((l,k)=>doc.text(l,M+8,y+4.5+k*5.6));y+=lines.length*5.6+1.2});
    if(blank){ensure(26);doc.setDrawColor(200,205,215);doc.setLineWidth(.3);doc.rect(M,y+2,CW,22);doc.setFontSize(8.5);color(GREY);doc.text('My working',M+2,y+6);y+=27}else y+=3};
  const phases=PHASES.filter(p=>p.lessons.some(id=>LBY[id])).filter(p=>scope.kind==='book'||(scope.kind==='phase'&&p.id===scope.id)||(scope.kind==='lesson'&&p.lessons.includes(scope.id)))
    .map(p=>({...p,lessons:p.lessons.filter(id=>LBY[id]&&(scope.kind!=='lesson'||id===scope.id)).map(id=>LBY[id])}));
  const scopeName=scope.kind==='book'?'The whole book':scope.kind==='phase'?phases[0].name:LBY[scope.id].title;
  const nLessons=phases.reduce((a,p)=>a+p.lessons.length,0);
  /* cover */
  doc.setFillColor(244,245,249);doc.rect(0,0,PW,PH,'F');doc.setDrawColor(...NAVY);doc.setLineWidth(1.2);doc.roundedRect(M,M,CW,PH-2*M,4,4);
  doc.setFont('helvetica','bold');doc.setFontSize(36);color(NAVY);doc.text('Maths Board',PW/2,78,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(15);color(GREY);doc.text('Notes, one drawing at a time',PW/2,90,{align:'center'});
  doc.setFont('helvetica','bold');doc.setFontSize(18);color(BLUE);doc.splitTextToSize(pdfClean(scopeName),CW-30).forEach((l,i)=>doc.text(l,PW/2,118+i*9,{align:'center'}));
  const first=phases[0].lessons[0];const img=boardCanvas(first,Math.min(3,first.steps.length-1)).toDataURL('image/jpeg',.85);doc.addImage(img,'JPEG',M+15,150,CW-30,(CW-30)*BH/BW);
  doc.setFont('helvetica','normal');doc.setFontSize(11);color(GREY);doc.text(`${nLessons} lesson${nLessons>1?'s':''}  ·  made ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}`,PW/2,PH-30,{align:'center'});
  /* contents pages reserved now, filled at the end */
  const tocCount=Math.max(1,Math.ceil((phases.length+nLessons+1)/26));for(let i=0;i<tocCount;i++)doc.addPage();
  return {doc,phases,scopeName,tocCount,PW,PH,M,CW,NAVY,BLUE,GREEN,GREY,toc,key,setY:v=>y=v,getY:()=>y,ensure,text,rich,question,color}}

async function buildPDF(scope,progress){const jsPDF=await loadJsPDF();const B=makeBook(jsPDF,scope),{doc,phases,PW,PH,M,CW,NAVY,BLUE,GREEN,GREY,toc,text,rich,question}=B;
  const tick=()=>new Promise(r=>setTimeout(r,0));let done=0;const total=phases.reduce((a,p)=>a+p.lessons.reduce((b,l)=>b+l.steps.length,0),0);
  for(const ph of phases){
    if(scope.kind!=='lesson'){doc.addPage();toc.push({t:ph.name,lvl:0,p:doc.getNumberOfPages()});
      doc.setFillColor(...hexRGB(ph.color));doc.rect(0,0,12,PH,'F');doc.setFont('helvetica','normal');doc.setFontSize(12);B.color(GREY);doc.text('Section',M+6,100);
      doc.setFont('helvetica','bold');doc.setFontSize(28);B.color(NAVY);doc.splitTextToSize(ph.name,CW-10).forEach((l,i)=>doc.text(l,M+6,114+i*12));
      doc.setFont('helvetica','normal');doc.setFontSize(12);B.color(NAVY);ph.lessons.forEach((l,i)=>doc.text(`${i+1}.  ${pdfClean(l.title)}`,M+6,150+i*8))}
    for(const L of ph.lessons){doc.addPage();B.setY(M);toc.push({t:L.title,lvl:1,p:doc.getNumberOfPages()});
      text(ph.name.toUpperCase(),9,'bold',GREY);B.setY(B.getY()+1);text(L.title,20,'bold',NAVY);B.setY(B.getY()+2);rich(L.summary,12,M,CW,GREY);B.setY(B.getY()+3);
      text('In this lesson you will learn to:',11,'bold',NAVY);L.objectives.forEach(o=>rich('•  '+o,11,M+3,CW-3));B.setY(B.getY()+4);
      for(let si=0;si<L.steps.length;si++){const st=L.steps[si];progress(`Drawing "${L.title}", step ${si+1} of ${L.steps.length}`,done/total);await tick();
        const ih=CW*BH/BW;B.ensure(ih+16);text(`Step ${si+1} of ${L.steps.length}:  ${st.title}`,13,'bold',BLUE);B.setY(B.getY()+1.5);
        doc.addImage(boardCanvas(L,si,total>60?1.05:1.4).toDataURL('image/jpeg',total>60?.78:.86),'JPEG',M,B.getY(),CW,ih,undefined,'FAST');B.setY(B.getY()+ih+4);
        st.explain.forEach((l,i)=>rich(`${i+1}.  ${l.t}`,11,M+2,CW-2));B.setY(B.getY()+3);
        if(st.check){question(st.check,`Check (step ${si+1})`,false);B.key.push({L,label:`Step ${si+1} check`,q:st.check})}
        B.setY(B.getY()+3);done++}
      if(L.practice&&L.practice.length){B.ensure(30);text('Practice',16,'bold',GREEN);B.setY(B.getY()+1);text('Tick one box for each question. Use the box under it for your working. Answers are at the back.',10.5,'normal',GREY);B.setY(B.getY()+2);
        L.practice.forEach((q,i)=>{question(q,`Question ${i+1}`,true);B.key.push({L,label:`Practice question ${i+1}`,q})})}}}
  /* answer key */
  progress('Writing the answer key',1);await tick();doc.addPage();B.setY(M);toc.push({t:'Answer key',lvl:0,p:doc.getNumberOfPages()});text('Answer key',22,'bold',NAVY);B.setY(B.getY()+3);
  let lastL=null;for(const k of B.key){if(k.L!==lastL){B.ensure(14);B.setY(B.getY()+2);text(k.L.title,13,'bold',BLUE);lastL=k.L}
    const j=k.q.options.findIndex(o=>o.ok),o=k.q.options[j];B.ensure(12);rich(`**${k.label}: ${'ABCD'[j]}. ${o.t}**  ${o.why}`,10.5);B.setY(B.getY()+1.5)}
  /* contents, page numbers, bookmarks */
  for(let i=0;i<B.tocCount;i++){doc.setPage(2+i);let yy=M+4;if(i===0){doc.setFont('helvetica','bold');doc.setFontSize(22);B.color(NAVY);doc.text('Contents',M,yy+8);yy+=20}
    for(const e of toc.slice(i*26,(i+1)*26)){doc.setFont('helvetica',e.lvl?'normal':'bold');doc.setFontSize(e.lvl?11.5:12.5);B.color(e.lvl?NAVY:BLUE);
      const x=M+(e.lvl?6:0),t=doc.splitTextToSize(pdfClean(e.t),CW-30)[0];doc.text(t,x,yy);doc.text(String(e.p),PW-M,yy,{align:'right'});
      doc.setDrawColor(220,224,232);doc.setLineDashPattern([.6,1.2],0);doc.line(x+doc.getTextWidth(t)+2,yy-1,PW-M-doc.getTextWidth(String(e.p))-2,yy-1);doc.setLineDashPattern([],0);
      doc.link(x,yy-5,CW-(x-M),7,{pageNumber:e.p});yy+=e.lvl?8.5:10}}
  const n=doc.getNumberOfPages();for(let p=2;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8.5);B.color(GREY);doc.text(`Maths Board  ·  ${pdfClean(B.scopeName)}`,M,PH-8);doc.text(`${p} / ${n}`,PW-M,PH-8,{align:'right'})}
  if(doc.outline){const roots={};toc.forEach(e=>{if(e.lvl===0||scope.kind==='lesson')roots.cur=doc.outline.add(null,pdfClean(e.t),{pageNumber:e.p});else doc.outline.add(roots.cur||null,pdfClean(e.t),{pageNumber:e.p})})}
  const name=('Maths-Board-'+(scope.kind==='book'?'whole-book':B.scopeName)).replace(/[^A-Za-z0-9]+/g,'-').replace(/-+$/,'')+'.pdf';
  return {blob:doc.output('blob'),name,pages:n}}
function hexRGB(h){const m=h.replace('#','').match(/../g);return m.map(x=>parseInt(x,16))}

/* ---------- the notes panel (a sheet at the bottom of the screen) ---------- */
let pdfBusy=false,pdfLast=null;
function pdfSheet(html){let s=document.getElementById('pdfsheet');if(!s){s=document.createElement('div');s.id='pdfsheet';s.className='sheet';s.setAttribute('role','dialog');s.setAttribute('aria-label','Notes PDF');document.body.appendChild(s)}s.innerHTML=html;s.hidden=!html}
async function makePDF(scope){if(pdfBusy)return;
  if(!IS_APP){pdfSheet(`<div class="sheet-in"><h3>PDFs download in the app</h3><p class="muted">This preview cannot save files. Open the Maths Board app to download notes:</p><p><a href="${APP_URL}">${APP_URL}</a></p><div><button class="btn" data-act="pdf-close">Close</button></div></div>`);return}
  pdfBusy=true;if(pdfLast)URL.revokeObjectURL(pdfLast.url);pdfLast=null;
  const prog=(msg,f)=>pdfSheet(`<div class="sheet-in"><h3>Making your notes…</h3><p class="muted">${esc(msg)}</p><div class="pbar"><span style="width:${Math.round(f*100)}%"></span></div></div>`);
  prog('Getting ready',0);
  try{const r=await buildPDF(scope,prog);const file=new File([r.blob],r.name,{type:'application/pdf'}),url=URL.createObjectURL(r.blob);pdfLast={file,url};
    const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),showDl=!(ios&&canShare);
    pdfSheet(`<div class="sheet-in"><h3>Your notes are ready</h3><p class="muted">${esc(r.name)} · ${r.pages} pages · ${(r.blob.size/1048576).toFixed(1)} MB</p><div class="row" style="display:flex;gap:10px;flex-wrap:wrap">${canShare?'<button class="btn primary" data-act="pdf-share">Share or save: WhatsApp, Files…</button>':''}${showDl?`<a class="btn ${canShare?'':'primary'}" href="${url}" download="${esc(r.name)}">Download PDF</a>`:''}<button class="btn ghost" data-act="pdf-close">Close</button></div><p class="muted" id="pdfmsg" style="font-size:.9rem">${canShare?'In the menu, pick WhatsApp to send it, or "Save to Files" to keep it.':'This browser cannot share files directly. Tap Download, then share the PDF from your Downloads or Files app.'}</p></div>`)}
  catch(e){pdfSheet(`<div class="sheet-in"><h3>Could not make the PDF</h3><p class="muted">${esc(e.message||e)}. Check your internet connection once, then try again.</p><div><button class="btn" data-act="pdf-close">Close</button></div></div>`)}
  finally{pdfBusy=false}}
function notesCardHTML(){const ph=PHASES.filter(p=>p.lessons.some(id=>LBY[id]));
  return `<section class="card" style="display:flex;flex-direction:column;gap:12px"><div><div class="eyebrow">Notes PDF</div><h2>Download your notes</h2><p class="muted">Every board, every explanation, practice questions with boxes to write in, and an answer key.</p></div>
  <div class="dlrow"><button class="btn primary" data-pdf="book">Whole book</button></div>
  <details class="dlgroup"><summary>One section or one lesson</summary><div class="dlgroup" style="margin-top:10px">${ph.map(p=>`<details class="dlgroup"><summary style="color:var(--ui)">${esc(p.name)} (${p.lessons.filter(id=>LBY[id]).length})</summary><div class="dlgroup" style="margin:8px 0 4px"><button class="btn" data-pdf="phase:${p.id}">Whole section</button>${p.lessons.filter(id=>LBY[id]).map(id=>`<button class="lesson" data-pdf="lesson:${id}"><span>${esc(LBY[id].title)}</span><span class="pill">PDF</span></button>`).join('')}</div></details>`).join('')}</div></details></section>`}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const pd=e.target.closest('[data-pdf]');if(pd){const v=pd.dataset.pdf;makePDF(v==='book'?{kind:'book'}:{kind:v.split(':')[0],id:v.split(':')[1]});return}
  const pa=e.target.closest('[data-act="pdf-close"],[data-act="pdf-share"]');if(pa){if(pa.dataset.act==='pdf-close')pdfSheet('');else if(pdfLast)navigator.share({files:[pdfLast.file],title:pdfLast.file.name}).catch(err=>{if(err&&err.name==='AbortError')return;const m=document.getElementById('pdfmsg');if(m)m.textContent='Sharing did not work here ('+(err&&err.message||'unknown reason')+'). Try again, or close and make the PDF again.'});return}
  const op=e.target.closest('[data-open]');if(op){S.last=op.dataset.open;save();if(location.hash==='#board'){e.preventDefault();route()}return}
  const o=e.target.closest('.opt');if(o){const k=o.dataset.q,oi=+o.dataset.o;(PL.clicked[k]=PL.clicked[k]||[]);if(!PL.clicked[k].includes(oi))PL.clicked[k].push(oi);
    if(k[0]==='r'){const n=S.nb.find(x=>x.id===+k.slice(1)),L=LBY[n.lesson],ok=allQuestions(L)[n.qkey].options[oi].ok;if(PL.clicked[k].length===1){if(ok){n.stage++;if(n.stage>=5)n.mastered=true;else n.due=Date.now()+INTERVALS[n.stage]}else{n.stage=0;n.due=Date.now()+INTERVALS[0]}save()}
      o.outerHTML=optHTML(null,k,oi,allQuestions(L)[n.qkey].options[oi],true,false);setTab('notebook');return}
    const L=PL.L,ok=answer(L,k,oi);if(k[0]==='s'){renderCheck();updateChrome()}else viewPractice();return}
  const a=e.target.closest('button,[data-act]');if(!a)return;
  if(a.id==='b-play'){const st=PL.L.steps[PL.si];if(PL.t>=st.total)PL.t=0;PL.playing=!PL.playing;PL.dirty=true}
  else if(a.id==='b-replay'){PL.t=0;PL.playing=true;PL.lit=-2;PL.dirty=true}
  else if(a.id==='b-prev'){if(PL.si>0)goStep(PL.si-1)}
  else if(a.id==='b-next'){if(!nextLocked())goStep(PL.si+1)}
  else if(a.id==='b-bm'){const p=prog(PL.L.id),i=p.bm.indexOf(PL.si);if(i>=0)p.bm.splice(i,1);else p.bm.push(PL.si);save();buildExplain()}
  else if(a.dataset.step!==undefined){goStep(+a.dataset.step)}
  else if(a.dataset.act==='back-steps'){document.getElementById('stage').innerHTML='';goStep(PL.L.steps.length-1,false)}
  else if(a.dataset.act==='install'){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;viewHome()})}}
  else if(a.dataset.act==='finish'){prog(PL.L.id).done=true;save();viewPractice()}});
document.addEventListener('input',e=>{if(e.target.id==='scrub'){const st=PL.L.steps[PL.si];PL.playing=false;PL.t=+e.target.value/1000*st.total;if(PL.t>=st.total&&!PL.ended){PL.ended=true;renderCheck();updateChrome()}PL.dirty=true}
  if(e.target.id==='note'){prog(PL.L.id).note=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.id==='speed')PL.speed=+e.target.value});
document.addEventListener('keydown',e=>{if(view!=='board'||!PL.L||PL.si>=PL.L.steps.length||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();document.getElementById('b-play').click()}else if(e.key==='ArrowRight'){if(!nextLocked())goStep(PL.si+1)}else if(e.key==='ArrowLeft'){if(PL.si>0)goStep(PL.si-1)}else if(e.key==='r'||e.key==='R'){document.getElementById('b-replay').click()}});
window.addEventListener('hashchange',route);

/* ---------- start once the handwriting font has loaded ---------- */
(async()=>{try{await Promise.race([Promise.all([document.fonts.load('400 30px Kalam'),document.fonts.load('700 30px Kalam')]),new Promise(r=>setTimeout(r,4000))])}catch(e){}
  LESSONS=buildLessons();LBY=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
  window.MB={LESSONS,validate:()=>validate(LESSONS),layoutIssues:()=>layoutIssues(LESSONS),renderBoard,stateAt,show:(id,si,t)=>{S.last=id;view='board';setTab('board');openBoard(id);PL.playing=false;goStep(si,false);PL.t=t==null?PL.L.steps[si].total:t;PL.ended=PL.t>=PL.L.steps[si].total;buildExplain();PL.lit=-2;draw()},ready:true};
  route();requestAnimationFrame(frame)})();
</script>
