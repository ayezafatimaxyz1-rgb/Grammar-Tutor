# Bolo English news robot: every 3 hours, collect the latest newspaper headlines
# (headline, short summary and link only) into news.json on the gh-pages branch.
# The script, fetch-news.mjs, is published with the app on gh-pages.
name: Bolo English news

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bolo-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect headlines
        run: node fetch-news.mjs news.json
      - name: Save news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "No new headlines."; exit 0; fi
          git commit -m "News update"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages && git push origin HEAD:gh-pages && exit 0
            sleep 5
          done
          exit 1
